name: Build Lecture Scribe

on:
  push:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk LectureScribe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LectureScribe-apk
          path: LectureScribe.apk

      # A release gives the tablet a plain download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/LectureScribe.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lecture Scribe 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: LectureScribe.apk
          body: |
            On the tablet, download **LectureScribe.apk** below and open it to install.
            Installing over an older version keeps all your saved lectures.
